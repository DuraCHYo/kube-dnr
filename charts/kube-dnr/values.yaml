# Default values for kube-dnr.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/durachyo/kube-dnr
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Backup schedule (cron format)
cronSchedule: "0 2 * * *"

# Application run arguments.
# Defaults: back up all namespaces to /tmp and upload the archive to S3.
# /tmp is a writable emptyDir (see volumes/volumeMounts below), so it works
# with readOnlyRootFilesystem: true.
args:
  - "--config"
  - "/etc/kube-dnr/config.json"
  - "backup"
  - "-A"
  - "-o"
  - "/tmp/sfaflprod.zip"
  - "--upload-s3"

# Application config (config.json). Rendered into a ConfigMap and mounted at
# /etc/kube-dnr/config.json (read-only), so the path in args above matches it.
# Set `config: null` to disable the ConfigMap and mount your own file via
# volumes/volumeMounts (e.g. from a Secret with real credentials).
config:
  kubernetes:
    excludedresources:
      - Pod
      - PodMetrics
      - NodeMetrics
      - Event
      - ReplicaSet
      - Endpoints
    excludednamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
    excludedsubstrings:
      - sh.helm.release
      - kube-root-ca.crt
  s3:
    bucket: ""
    endpoint: ""
    region: "us-east-1"
    accesskeyid: ""
    secretaccesskey: ""
    usessl: true

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# The image runs as non-root (distroless:nonroot) and the application only
# needs a writable /tmp (backup archive and temporary files). With the
# read-only root filesystem below, /tmp is provided by an emptyDir volume.
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65532

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Additional volumes on the output Deployment definition.
volumes:
  - name: tz-config
    hostPath:
      path: /etc/localtime
      type: ""
  # The root filesystem is read-only, so /tmp must be mounted separately:
  # the app writes the backup archive and restore temp files there.
  - name: tmp
    emptyDir: {}
# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: tz-config
    readOnly: true
    mountPath: /etc/localtime
  - name: tmp
    mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/infra
              operator: In
              values:
                - "true"
